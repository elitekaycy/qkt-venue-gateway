name: docs

# Builds the MkDocs Material site and deploys it to GitHub Pages.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'adapter-*/README.md'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs + plugins
        run: pip install -r requirements-docs.txt

      - name: Build MkDocs site
        run: mkdocs build --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Fails the run when the live site is not answering, so a Pages setting that drifts (source branch,
  # custom domain) is noticed on the next deploy instead of by a visitor.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # The site sits behind Cloudflare, whose bot rules refuse GitHub's runners (403), so the check asks
      # GitHub Pages itself: the Pages settings, then the page from GitHub's own servers.
      - name: Check Pages serves the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          host=venuegw.tryqkt.com
          pages="$(gh api "repos/$GITHUB_REPOSITORY/pages" -q '.build_type + " " + .cname')"
          if [ "$pages" != "workflow $host" ]; then
            echo "::error::Pages is '$pages', want 'workflow $host': check Settings > Pages (source GitHub Actions, custom domain)"
            exit 1
          fi
          for _ in $(seq 1 8); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --resolve "$host:80:185.199.108.153" "http://$host/" || true)
            [ "$code" = 200 ] && exit 0
            sleep 15
          done
          echo "::error::GitHub Pages answered ${code:-nothing} for $host after the deploy"
          exit 1
