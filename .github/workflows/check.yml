name: check

# Every pull request and every push to dev and main: the build (compile, ktlint, every module's tests offline),
# the repository rules, and the image, started with docker compose and serving VGP. `build`, `rules`
# and `image` are required checks on main (CONTRIBUTING.md); a docs-only change skips `build` and
# `image`, which a required check accepts.

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build --no-daemon

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-rules.sh
      - run: shellcheck scripts/*.sh

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the paper gateway with docker compose and wait for its healthcheck
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180 gateway-paper
      - name: Serve VGP from the container
        run: |
          set -a; . ./.env; set +a
          auth="Authorization: Bearer $PAPER_TRADER_TOKEN"
          health=$(curl -fsS -H "$auth" http://127.0.0.1:8443/v1/health)
          echo "$health"
          grep -q '"adapter":"paper"' <<<"$health"
          grep -q "\"adapter_version\":\"$(cat VERSION)\"" <<<"$health"
          curl -fsS -H "$auth" http://127.0.0.1:8443/v1/account | grep -q '"balance":"10000"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:8443/v1/health)" = 401
      - name: Container logs
        if: always()
        run: docker compose logs gateway-paper
      - run: docker compose down -v
        if: always()
