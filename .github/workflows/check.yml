name: check

# Every pull request and every push to dev and main: the build (compile, ktlint, every module's tests offline),
# the repository rules, and the image, started with docker compose and serving VGP. `build`, `rules`
# and `image` are required checks on main (CONTRIBUTING.md); a docs-only change skips `build` and
# `image`, which a required check accepts.

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build koverXmlReport koverHtmlReport --no-daemon
      # Every line a pull request adds or edits under a module's src/main must run under test
      # (docs/project/test-coverage.md). The merged Kover XML is read locally; nothing is uploaded.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Diff coverage (100% of changed lines)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pip install --quiet -r config/coverage-requirements.txt
          DIFF_COVERAGE_HTML=build/reports/diff-coverage.html DIFF_COVERAGE_MARKDOWN=build/reports/diff-coverage.md \
            scripts/check-diff-coverage.sh "$BASE_SHA" || { cat build/reports/diff-coverage.md >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          cat build/reports/diff-coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            build/reports/kover/
            build/reports/diff-coverage.*
          retention-days: 14

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/check-rules.sh
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install --quiet -r config/coverage-requirements.txt && bash tests/scripts/check-diff-coverage-test.sh
      - run: shellcheck scripts/*.sh tests/scripts/*.sh

  image:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Start the paper gateway with docker compose and wait for its healthcheck
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180 gateway-paper
      - name: Serve VGP from the container
        run: |
          set -a; . ./.env; set +a
          auth="Authorization: Bearer $PAPER_TRADER_TOKEN"
          health=$(curl -fsS -H "$auth" http://127.0.0.1:8443/v1/health)
          echo "$health"
          grep -q '"adapter":"paper"' <<<"$health"
          grep -q "\"adapter_version\":\"$(cat VERSION)\"" <<<"$health"
          curl -fsS -H "$auth" http://127.0.0.1:8443/v1/account | grep -q '"balance":"10000"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer wrong' http://127.0.0.1:8443/v1/health)" = 401
      - name: Container logs
        if: always()
        run: docker compose logs gateway-paper
      - run: docker compose down -v
        if: always()
