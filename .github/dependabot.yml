version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule: {interval: weekly}
    groups:
      gradle-minor-patch: {update-types: [minor, patch]}
    commit-message: {prefix: build}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: ci}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
    commit-message: {prefix: build}
